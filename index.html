<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本 47 都道府縣制霸互動圖 (用戶自訂版)</title>
    <!-- Tailwind CSS 樣式框架 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .prefecture {
            transition: fill 0.3s ease, stroke 0.3s ease;
            cursor: pointer;
            stroke: #ffffff;
            stroke-width: 0.8px;
        }
        .prefecture:hover {
            stroke: #1e293b;
            stroke-width: 2px;
            filter: brightness(0.9);
        }
        /* Tooltip 樣式 */
        #tooltip {
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between font-sans">

    <!-- 頂部標題區 -->
    <header class="bg-white shadow-sm border-b border-slate-200 py-4 px-6">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                    🇯🇵 日本 47 都道府縣制霸互動圖
                </h1>
                <p class="text-sm text-slate-500 mt-1">點擊地圖上的縣市，或使用下方表單來輸入與更新您的造訪次數</p>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="resetAllData()" 
                    class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition">
                    重設所有資料
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- 左側：地圖顯示區 (佔 7 格) -->
        <div class="lg:col-span-7 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center relative">
            <div class="w-full flex justify-between items-center mb-4">
                <h2 class="font-semibold text-slate-700 text-lg">互動式日本地圖</h2>
                <span class="text-xs text-slate-400 bg-slate-100 px-2.5 py-1 rounded-full">點擊縣市直接編輯</span>
            </div>
            
            <!-- SVG 日本地圖容器 -->
            <div class="relative w-full aspect-[4/3] flex items-center justify-center bg-slate-50 rounded-xl overflow-hidden border border-slate-100">
                <svg id="japanMap" viewBox="0 0 600 600" class="w-full h-full max-h-[500px]">
                    <!-- 動態產生的地圖路徑將由 JavaScript 填入 -->
                </svg>
                
                <!-- 浮動提示框 (Tooltip) -->
                <div id="tooltip" class="absolute hidden bg-slate-900/90 text-white text-xs px-3 py-1.5 rounded-lg shadow-lg z-20 backdrop-blur-sm">
                    <span id="tipName" class="font-bold"></span><br>
                    <span id="tipCount"></span>
                    <span class="text-[10px] text-slate-300 block mt-0.5">（點擊可修改次數）</span>
                </div>
            </div>

            <!-- 圖例說明 -->
            <div class="w-full mt-6 pt-4 border-t border-slate-100">
                <p class="text-xs font-medium text-slate-500 mb-2">造訪頻次圖例：</p>
                <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
                    <div class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 rounded-full bg-[#E0E0E0] inline-block"></span>0次 (未造訪)</div>
                    <div class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 rounded-full bg-[#4CAF50] inline-block"></span>1次</div>
                    <div class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 rounded-full bg-[#FFEB3B] inline-block border border-slate-300"></span>2次</div>
                    <div class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 rounded-full bg-[#FF9800] inline-block"></span>3次</div>
                    <div class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 rounded-full bg-[#F44336] inline-block"></span>4次以上</div>
                </div>
            </div>
        </div>

        <!-- 右側：統計數據與單一縣市編輯器 (佔 5 格) -->
        <div class="lg:col-span-5 flex flex-col gap-6">
            
            <!-- 統計數據卡片 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h3 class="font-semibold text-slate-700 text-lg mb-4 flex items-center gap-2">
                    📊 足跡制霸統計
                </h3>
                
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-center">
                        <p class="text-xs text-slate-500 mb-1">已解鎖縣市數</p>
                        <p class="text-2xl font-bold text-blue-600" id="statUnlocked">0 / 47</p>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-center">
                        <p class="text-xs text-slate-500 mb-1">總制霸率</p>
                        <p class="text-2xl font-bold text-emerald-600" id="statRate">0.0%</p>
                    </div>
                </div>

                <!-- 進度條 -->
                <div>
                    <div class="flex justify-between text-xs text-slate-500 mb-1">
                        <span>制霸進度</span>
                        <span id="statRateText">0%</span>
                    </div>
                    <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                        <div id="statProgressBar" class="bg-blue-600 h-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- UI 輸入/編輯面板 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h3 class="font-semibold text-slate-700 text-lg mb-3">✏️ 編輯造訪次數</h3>
                <p class="text-xs text-slate-400 mb-4">請選擇縣市並輸入您實際造訪的次數：</p>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">選擇都道府縣</label>
                        <select id="prefSelect" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                            <!-- 動態填入 47 個縣市選項 -->
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">造訪次數 (0 ~ 10+)</label>
                        <input type="number" id="prefCountInput" min="0" value="0" 
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <button onclick="updatePrefectureFromUI()" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-sm">
                        更新縣市記錄
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
        Japan 47 Prefectures Explorer &copy; 2026. All rights reserved.
    </footer>

    <!-- JavaScript 邏輯與動態 UI 狀態管理 -->
    <script>
        // 1. 完整 47 都道府縣清單
        const PREFECTURES = [
            "北海道", "青森縣", "岩手縣", "宮城縣", "秋田縣", "山形縣", "福島縣",
            "茨城縣", "栃木縣", "群馬縣", "埼玉縣", "千葉縣", "東京都", "神奈川縣",
            "新潟縣", "富山縣", "石川縣", "福井縣", "山梨縣", "長野縣", "岐阜縣",
            "靜岡縣", "愛知縣", "三重縣", "滋賀縣", "京都府", "大阪府", "兵庫縣",
            "奈良縣", "和歌山縣", "鳥取縣", "島根縣", "岡山縣", "廣島縣", "山口縣",
            "德島縣", "香川縣", "愛媛縣", "高知縣", "福岡縣", "佐賀縣", "長崎縣",
            "熊本縣", "大分縣", "宮崎縣", "鹿兒島縣", "沖繩縣"
        ];

        // 2. 用戶動態輸入資料儲存物件（初始全數為 0）
        let userData = {};
        PREFECTURES.forEach(pref => {
            userData[pref] = 0;
        });

        // 3. 顏色對應規則
        function getColorByCount(count) {
            if (count >= 4) return "#F44336"; // 紅色 (4次以上)
            if (count === 3) return "#FF9800"; // 橘色 (3次)
            if (count === 2) return "#FFEB3B"; // 黃色 (2次)
            if (count === 1) return "#4CAF50"; // 綠色 (1次)
            return "#E0E0E0";                  // 灰色 (0次)
        }

        // 4. 初始化下拉選單與 SVG 地圖
        function initApp() {
            const selectEl = document.getElementById('prefSelect');
            selectEl.innerHTML = '';
            PREFECTURES.forEach(pref => {
                const opt = document.createElement('option');
                opt.value = pref;
                opt.innerText = pref;
                selectEl.appendChild(opt);
            });

            // 綁定下拉選單變更事件，讓輸入框自動帶入該縣市目前次數
            selectEl.addEventListener('change', (e) => {
                const selectedPref = e.target.value;
                document.getElementById('prefCountInput').value = userData[selectedPref] || 0;
            });

            generateJapanSVG();
            refreshUI();
        }

        // 5. 產生日本 47 都道府縣分佈圖塊 (SVG)
        function generateJapanSVG() {
            const svg = document.getElementById('japanMap');
            svg.innerHTML = '';
            const coordinates = getMockCoordinates();

            coordinates.forEach(item => {
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", item.d);
                path.setAttribute("class", "prefecture");
                path.setAttribute("id", `pref-${item.name}`);

                // 滑鼠互動事件
                path.addEventListener("mousemove", (e) => showTooltip(e, item.name));
                path.addEventListener("mouseleave", hideTooltip);
                // 點擊地圖直接將下拉選單切換至該縣市，方便快速修改
                path.addEventListener("click", () => {
                    document.getElementById('prefSelect').value = item.name;
                    document.getElementById('prefCountInput').value = userData[item.name] || 0;
                    document.getElementById('prefCountInput').focus();
                });

                g.appendChild(path);
                svg.appendChild(g);
            });
        }

        // 6. 透過 UI 表單更新特定縣市次數
        function updatePrefectureFromUI() {
            const pref = document.getElementById('prefSelect').value;
            const count = parseInt(document.getElementById('prefCountInput').value, 10);

            if (isNaN(count) || count < 0) {
                alert("請輸入有效的正整數次數！");
                return;
            }

            userData[pref] = count;
            refreshUI();
        }

        // 7. 重設所有資料
        function resetAllData() {
            if (confirm("確定要將所有縣市的造訪次數歸零嗎？")) {
                PREFECTURES.forEach(pref => {
                    userData[pref] = 0;
                });
                document.getElementById('prefCountInput').value = 0;
                refreshUI();
            }
        }

        // 8. 重新整理畫面呈現（地圖著色與統計數據）
        function refreshUI() {
            let unlockedCount = 0;

            PREFECTURES.forEach(pref => {
                const count = userData[pref] || 0;
                if (count > 0) unlockedCount++;

                const pathEl = document.getElementById(`pref-${pref}`);
                if (pathEl) {
                    pathEl.setAttribute("fill", getColorByCount(count));
                    pathEl.dataset.count = count;
                }
            });

            // 更新統計數據與進度條
            const rate = ((unlockedCount / 47) * 100).toFixed(1);
            document.getElementById('statUnlocked').innerText = `${unlockedCount} / 47`;
            document.getElementById('statRate').innerText = `${rate}%`;
            document.getElementById('statRateText').innerText = `${rate}%`;
            document.getElementById('statProgressBar').style.width = `${rate}%`;
        }

        // Tooltip 顯示
        function showTooltip(e, prefName) {
            const tooltip = document.getElementById('tooltip');
            const count = userData[prefName] || 0;

            document.getElementById('tipName').innerText = prefName;
            document.getElementById('tipCount').innerText = `造訪次數：${count} 次`;

            tooltip.classList.remove('hidden');
            
            const container = tooltip.parentElement.getBoundingClientRect();
            const x = e.clientX - container.left + 15;
            const y = e.clientY - container.top - 35;
            
            tooltip.style.left = `${x}px`;
            tooltip.style.top = `${y}px`;
        }

        // Tooltip 隱藏
        function hideTooltip() {
            const tooltip = document.getElementById('tooltip');
            tooltip.classList.add('hidden');
        }

        // 日本 47 都道府縣幾何分佈座標
        function getMockCoordinates() {
            return [
                { name: "北海道", d: "M380,30 L450,20 L490,70 L440,110 L370,80 Z" },
                { name: "青森縣", d: "M370,130 L410,120 L420,150 L380,160 Z" },
                { name: "岩手縣", d: "M420,150 L450,140 L460,190 L420,190 Z" },
                { name: "宮城縣", d: "M420,190 L460,190 L450,220 L410,210 Z" },
                { name: "秋田縣", d: "M380,160 L420,150 L420,190 L380,190 Z" },
                { name: "山形縣", d: "M380,190 L420,190 L410,220 L370,220 Z" },
                { name: "福島縣", d: "M380,220 L420,220 L430,250 L370,250 Z" },
                { name: "茨城縣", d: "M420,260 L450,260 L440,290 L410,280 Z" },
                { name: "栃木縣", d: "M390,250 L420,250 L420,280 L390,280 Z" },
                { name: "群馬縣", d: "M360,250 L390,250 L390,280 L360,280 Z" },
                { name: "埼玉縣", d: "M370,280 L400,280 L390,300 L360,300 Z" },
                { name: "千葉縣", d: "M410,290 L440,290 L430,330 L400,320 Z" },
                { name: "東京都", d: "M370,300 L400,300 L390,320 L360,320 Z" },
                { name: "神奈川縣", d: "M360,320 L390,320 L380,340 L350,340 Z" },
                { name: "新潟縣", d: "M330,220 L370,220 L360,260 L320,250 Z" },
                { name: "富山縣", d: "M300,250 L330,250 L320,270 L290,270 Z" },
                { name: "石川縣", d: "M270,230 L300,230 L290,270 L260,260 Z" },
                { name: "福井縣", d: "M270,270 L300,270 L290,300 L260,290 Z" },
                { name: "山梨縣", d: "M330,280 L360,280 L350,310 L320,300 Z" },
                { name: "長野縣", d: "M330,250 L360,250 L360,280 L330,280 Z" },
                { name: "岐阜縣", d: "M300,270 L330,270 L320,310 L290,300 Z" },
                { name: "靜岡縣", d: "M350,310 L390,310 L380,340 L340,330 Z" },
                { name: "愛知縣", d: "M310,310 L340,310 L330,340 L300,340 Z" },
                { name: "三重縣", d: "M300,340 L330,340 L320,380 L290,370 Z" },
                { name: "滋賀縣", d: "M280,310 L300,310 L290,340 L270,340 Z" },
                { name: "京都府", d: "M260,300 L280,300 L270,340 L250,340 Z" },
                { name: "大阪府", d: "M260,340 L280,340 L270,370 L250,370 Z" },
                { name: "兵庫縣", d: "M230,320 L260,320 L250,360 L220,350 Z" },
                { name: "奈良縣", d: "M280,350 L300,350 L290,380 L270,380 Z" },
                { name: "和歌山縣", d: "M260,380 L290,380 L280,420 L250,410 Z" },
                { name: "鳥取縣", d: "M210,330 L240,330 L230,350 L200,350 Z" },
                { name: "島根縣", d: "M170,330 L210,330 L200,360 L160,350 Z" },
                { name: "岡山縣", d: "M210,360 L240,360 L230,390 L200,380 Z" },
                { name: "廣島縣", d: "M170,360 L210,360 L200,390 L160,380 Z" },
                { name: "山口縣", d: "M130,360 L160,360 L150,400 L120,390 Z" },
                { name: "德島縣", d: "M230,400 L260,400 L250,430 L220,420 Z" },
                { name: "香川縣", d: "M220,380 L250,380 L240,400 L210,400 Z" },
                { name: "愛媛縣", d: "M180,390 L220,390 L210,420 L170,410 Z" },
                { name: "高知縣", d: "M190,420 L230,420 L220,450 L180,440 Z" },
                { name: "福岡縣", d: "M90,380 L120,380 L110,410 L80,400 Z" },
                { name: "佐賀縣", d: "M70,400 L90,400 L85,425 L65,420 Z" },
                { name: "長崎縣", d: "M45,400 L70,400 L65,440 L40,430 Z" },
                { name: "熊本縣", d: "M80,420 L110,420 L100,460 L75,450 Z" },
                { name: "大分縣", d: "M110,390 L135,390 L130,430 L105,420 Z" },
                { name: "宮崎縣", d: "M110,440 L135,440 L125,480 L100,470 Z" },
                { name: "鹿兒島縣", d: "M85,470 L115,470 L105,510 L75,500 Z" },
                { name: "沖繩縣", d: "M50,540 L100,540 L90,570 L40,570 Z" }
            ];
        }

        // 頁面載動時初始化
        window.onload = initApp;
    </script>
</body>
</html>
